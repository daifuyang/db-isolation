# nginx reverse proxy for db-isolation API.
#
# Drop this file into /etc/nginx/conf.d/db-isolation.conf (or include it
# from your existing server block). The API itself only listens on
# 127.0.0.1:8787, so nginx on the same box can reach it via loopback.
#
# Recommended deployment:
#
#   server {
#     listen 443 ssl;
#     server_name dbi.example.com;
#     ssl_certificate     /etc/letsencrypt/live/dbi.example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/dbi.example.com/privkey.pem;
#
#     # Apply the location below to all paths.
#     include /etc/nginx/snippets/db-isolation-location.conf;
#   }
#
# Why a separate location file: you can include the same proxy rules from
# multiple server blocks (TLS + plain) without duplicating them.
#
# Security notes:
#   - Do NOT expose 8787 directly through any other listener — the API
#     has no built-in rate limiting and a stolen token lets a caller
#     provision databases.
#   - Bearer tokens are passed straight through; nginx sees them but
#     does not log them. Audit logging happens server-side.
#   - Client-body size limit is small: requests are tiny JSON.

# /etc/nginx/snippets/db-isolation-location.conf
location / {
    # Only forward to the local API. Loopback only.
    proxy_pass http://127.0.0.1:8787;

    # Standard proxy hygiene.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Keep the connection alive — many CLI invocations are short.
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_connect_timeout 5s;

    # Small request bodies; big uploads would be suspicious.
    client_max_body_size 8k;

    # Tell the upstream what kind of client this is.
    proxy_set_header Connection "";

    # Buffering off — keep error semantics synchronous.
    proxy_buffering off;
}

# /etc/nginx/conf.d/db-isolation.conf (optional standalone snippet)
#
# Use this if you want a self-contained nginx site without server-level
# TLS termination (e.g., a Tailscale-only listener).
#
# server {
#     listen 100.64.0.1:8787 ssl;
#     server_name dbi.internal;
#     ssl_certificate     /etc/ssl/private/dbi.crt;
#     ssl_certificate_key /etc/ssl/private/dbi.key;
#     include /etc/nginx/snippets/db-isolation-location.conf;
# }